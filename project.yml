name: MacUtils
options:
  bundleIdPrefix: com.iburimskiy
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MacUtils:
    type: application
    platform: macOS
    sources:
      - path: MacUtils
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iburimskiy.MacUtils
        PRODUCT_NAME: MacUtils
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MacUtils/Info.plist
        ENABLE_APP_SANDBOX: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    info:
      path: MacUtils/Info.plist
      properties:
        CFBundleDisplayName: Mac Utils
        CFBundleName: MacUtils
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: ""
    dependencies:
      - sdk: IOKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: ServiceManagement.framework
